<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<title>Registro Rápido</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#eef1f5;color:#1a1a1a}
header{background:#0b3d6e;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));font-size:19px;font-weight:600;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center}
header span{flex:1}
main{padding:10px;padding-bottom:calc(90px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
.n{background:#fff;border-radius:10px;padding:8px;margin:8px 0;box-shadow:0 1px 3px #0002}
.n .n{margin-left:6px;border-left:4px solid #2a6fb0;box-shadow:none;background:#f5f8fc;border-radius:0 8px 8px 0}
.n .n .n{border-left-color:#e08a00;background:#fffaf2}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0;font-size:16px;padding:9px;border:1px solid #ccd;border-radius:6px;background:#fff}
.tag{font-size:11px;color:#fff;background:#0b3d6e;border-radius:4px;padding:3px 6px;white-space:nowrap}
.c>.row .tag{background:#2a6fb0}.s>.row .tag{background:#e08a00}
button{font-size:14px;padding:9px 11px;border:0;border-radius:6px;background:#0b3d6e;color:#fff;cursor:pointer;touch-action:manipulation}
button:active{opacity:.75}
button.x{background:#c62828}button.g{background:#2e7d32}button.add{background:#2a6fb0;margin-top:4px}
.s2 button.add{background:#e08a00}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.slot{width:calc(50% - 4px);max-width:170px}
.box{aspect-ratio:1;border:2px dashed #99a;border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center;padding:8px;background:#fff}
.box.on{border:0;padding:0}
.box img{width:100%;height:100%;object-fit:cover;display:block}
.box button{font-size:13px;padding:9px 4px;background:#e8eef6;color:#0b3d6e}
.box .del{position:absolute;top:4px;right:4px;background:#c62828;color:#fff;border-radius:50%;width:28px;height:28px;padding:0;font-size:17px;line-height:28px}
.ftog{background:#889;font-size:13px;padding:8px 12px;margin:6px 0 2px}
.ftog.on{background:#2e7d32}
#pend{font-size:13px;color:#ffd54f;font-weight:500}
.rot{font-size:12px;font-weight:600;color:#0b3d6e;background:#e8eef6;border-radius:0 0 8px 8px;padding:5px 6px;line-height:1.25;word-break:break-word;text-align:center}
.rot.warn{color:#b3261e;background:#fdecea}
.rot.pend{color:#8a5a00;background:#fff3d6;border-radius:8px;margin-top:4px}
.box.on{border-radius:8px 8px 0 0}
.bdg{position:absolute;top:4px;left:4px;background:#0b3d6ee6;color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:12px;pointer-events:none}
.c .bdg{background:#2a6fb0e6}.s .bdg{background:#e08a00e6}
.box img{cursor:zoom-in}
#ver{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#ver.on{display:flex}
#ver .vt{color:#fff;background:#0b3d6e;padding:12px 50px 12px 14px;padding-top:max(12px,env(safe-area-inset-top));font-weight:700;font-size:15px;position:relative}
#ver .vt button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#c62828;width:36px;height:36px;border-radius:50%;padding:0;font-size:20px}
#ver img{flex:1;min-height:0;object-fit:contain;width:100%}
#ver .vb{color:#0b3d6e;background:#e8eef6;padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));font-weight:700;text-align:center;font-size:15px}
#bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -2px 6px #0002;z-index:5}
#bar button{flex:1;padding:13px 6px;font-size:15px}
button.z{background:#6a1b9a}
#tit{width:100%;font-size:16px;padding:10px;border-radius:6px;border:1px solid #ccd}
#addP{width:100%;margin-top:8px;padding:13px;font-size:15px}
#msg{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
.vacio{color:#667;text-align:center;padding:16px 8px;font-size:14px}
button.mv{background:#556}
.vrow{display:flex;gap:6px;margin:6px 0 2px}.vrow button{flex:1;font-size:13px;padding:9px 6px;background:#e8eef6;color:#0b3d6e}
.vid{width:calc(50% - 4px);max-width:170px;margin:6px 0 2px}
.vbox{aspect-ratio:16/10;background:#222;border-radius:8px 8px 0 0;position:relative;overflow:hidden;cursor:pointer}
.vbox img{width:100%;height:100%;object-fit:cover;display:block}
.vbox .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#000a;color:#fff;font-size:20px;line-height:44px;text-align:center;pointer-events:none}
.vbox .del{position:absolute;top:4px;right:4px;background:#c62828;color:#fff;border-radius:50%;width:28px;height:28px;padding:0;font-size:17px;line-height:28px}
.vbox .bdg{background:#6a1b9ae6}
.vgal{width:100%;font-size:12px;padding:7px;background:#6a1b9a;border-radius:0 0 8px 8px;margin-top:0}
.vid .rot{border-radius:0}
#ver video{flex:1;min-height:0;width:100%;background:#000;display:none}
.n.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px #ffb300}100%{box-shadow:0 1px 3px #0002}}
#mov{position:fixed;inset:0;background:#0008;z-index:15;display:none;align-items:flex-end;justify-content:center}
#mov.on{display:flex}
#mov .hc{background:#fff;width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#mov .ht{display:flex;align-items:center;gap:8px;font-weight:700;color:#0b3d6e;font-size:15px;margin-bottom:4px}
#mov .ht span{flex:1;word-break:break-word}
#mov .ht button{background:#c62828;width:34px;height:34px;border-radius:50%;padding:0;font-size:19px;flex:none}
#mov .pos{font-size:13px;color:#556;margin-bottom:8px}
#mov .hrow{display:flex;gap:8px}#mov .hrow button{flex:1;padding:12px}
#mov button:disabled{opacity:.35}
#mov .hsub{font-size:13px;font-weight:600;color:#334;margin:14px 0 6px}
#mov .dst{display:block;width:100%;text-align:left;background:#e8eef6;color:#0b3d6e;margin:5px 0;padding:11px}
#mov .dst.l1{margin-left:16px;width:calc(100% - 16px)}#mov .dst.l2{margin-left:32px;width:calc(100% - 32px)}
#mov .dst small{display:block;font-weight:400;color:#556;font-size:12px;margin-top:2px}
#mov .nota{font-size:12px;color:#667;margin-top:8px}
#btnNube{background:#ffffff26;font-size:18px;padding:6px 10px;position:relative;display:flex;align-items:center;gap:4px}
#nubePct{font-size:13px;font-weight:700;color:#ffd54f}#nubePct:empty{display:none}
#nube .pbar{height:12px;background:#e8eef6;border-radius:6px;overflow:hidden;margin:6px 0 2px}#nube .pbar i{display:block;height:100%;background:#ffb300;transition:width .3s}
#btnNube::after{content:'';position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:transparent}
#btnNube.ok::after{background:#4caf50}#btnNube.sync::after{background:#ffd54f}#btnNube.err::after,#btnNube.warn::after{background:#ff7043}
#nube{position:fixed;inset:0;background:#0008;z-index:15;display:none;align-items:flex-end;justify-content:center}
#nube.on{display:flex}
#nube .card{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
#nube h3{margin:0 0 6px;color:#0b3d6e;display:flex;align-items:center}#nube h3 span{flex:1}
#nube h3 button{background:#c62828;border-radius:50%;width:34px;height:34px;padding:0;font-size:19px}
#nube p{margin:8px 0;font-size:14px;line-height:1.35}#nube .mini{font-size:12px;color:#667}
#nube .est{font-weight:600;color:#0b3d6e}#nube .est.err,#nube .est.warn{color:#b3261e}#nube .est.ok{color:#2e7d32}
#nube .nb{display:block;width:100%;margin:8px 0;padding:12px;font-size:15px}
#nube .nb.sec{background:#2a6fb0}#nube .nb.out{background:none;color:#b3261e;text-decoration:underline;font-size:13px}
#nube .lst button{display:block;width:100%;text-align:left;background:#e8eef6;color:#0b3d6e;margin:6px 0;padding:10px}
#nube .lst small{display:block;color:#556;font-size:12px;margin-top:2px}
</style></head><body>
<header><span>Registro Rápido <small id="pend"></small></span><button id="btnNube" aria-label="Respaldo en la nube">☁️<small id="nubePct"></small></button><button class="x" id="btnNuevo">Nuevo</button></header>
<main>
<input id="tit" placeholder="Título del informe" autocomplete="off">
<div id="L"></div>
<button id="addP">+ Parte</button>
</main>
<div id="bar"><button id="btnWord">Informe Word</button><button class="g" id="btnPdf">Informe PDF</button><button class="z" id="btnZip">ZIP + videos</button></div>
<div id="msg"></div>
<div id="nube"><div class="card"><h3><span>☁️ Respaldo en la nube</span><button id="nube_x" aria-label="Cerrar">×</button></h3><div id="nube_c"></div></div></div>
<div id="ver"><div class="vt"><span id="ver_t"></span><button id="ver_x" aria-label="Cerrar">×</button></div><img id="ver_i" alt=""><video id="ver_v" controls playsinline></video><div class="vb" id="ver_b"></div></div>
<div id="mov"><div class="hc"><div class="ht"><span id="mov_t"></span><button id="mov_x" aria-label="Cerrar">×</button></div>
<div class="pos" id="mov_p"></div><div class="hrow"><button id="mov_up">↑ Subir</button><button id="mov_dn">↓ Bajar</button></div>
<div class="hsub">Mover dentro de:</div><div id="mov_l"></div><div class="nota">Al moverlo se lleva todo su contenido y fotos. Máximo 3 niveles.</div></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<input type="file" id="vcam" accept="video/*" capture="environment" hidden>
<input type="file" id="vgal" accept="video/*" hidden>
<script>
'use strict';
/* ===== Almacenamiento: estructura en localStorage, fotos (Blob) en IndexedDB ===== */
const KEY='rr3';
const NIV=['Parte','Componente','Subparte'],CL=['','c','s'],MAXF=4;
let D={titulo:'',partes:[]};
try{D=JSON.parse(localStorage.getItem(KEY))||D}catch(e){}
// fotos: lista compacta de ids (hasta 4)
function normalizar(l){l.forEach(o=>{o.fotos=(o.fotos||[]).filter(Boolean).slice(0,MAXF);o.video=o.video||null;o.hijos=o.hijos||[];normalizar(o.hijos)})}
normalizar(D.partes);
const save=sinNube=>{if(!D.rid)D.rid=uid();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar')}updPend();if(!sinNube)programarRespaldo()};
function pendientes(){let n=0;const w=o=>{if(o.req&&!o.fotos.length)n++;o.hijos.forEach(w)};D.partes.forEach(w);return n}
function updPend(){const n=pendientes();pend.textContent=n?n+' sin foto':''}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nuevo=()=>({id:uid(),nombre:'',req:false,fotos:[],video:null,hijos:[]});

let dbP=null;
function db(){return dbP||(dbP=new Promise((ok,ko)=>{const r=indexedDB.open('registro-rapido',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((ok,ko)=>{const t=d.transaction('fotos',mode),s=t.objectStore('fotos');
 const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})}
const fPut=(id,v)=>idb('readwrite',s=>s.put(v,id));
const fGet=id=>idb('readonly',s=>s.get(id));
const fDel=ids=>ids.length?idb('readwrite',s=>{ids.forEach(i=>s.delete(i))}):Promise.resolve();
const fClear=()=>idb('readwrite',s=>s.clear());
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

const urls=new Map(); // id -> objectURL
async function urlDe(id){if(urls.has(id))return urls.get(id);const f=await fGet(id);if(!f)return null;const u=URL.createObjectURL(f.blob);urls.set(id,u);return u}
function soltarURL(id){[id,id+'#p'].forEach(k=>{if(urls.has(k)){URL.revokeObjectURL(urls.get(k));urls.delete(k)}})}
async function urlPoster(id){const k=id+'#p';if(urls.has(k))return urls.get(k);const f=await fGet(id);if(!f||!f.poster)return null;const u=URL.createObjectURL(f.poster.blob);urls.set(k,u);return u}

/* ===== Árbol ===== */
const P=s=>s.split('.').map(Number);
function get(p){let o={hijos:D.partes};p.forEach(i=>o=o.hijos[i]);return o}
function padre(p){return p.length>1?get(p.slice(0,-1)):{hijos:D.partes}}
function ruta(p){const r=[];let o={hijos:D.partes};p.forEach((i,k)=>{o=o.hijos[i];r.push(o.nombre.trim()||'(sin nombre '+NIV[k].toLowerCase()+')')});return r.join(' - ')}
function fotosDe(o,acc=[]){o.fotos.forEach(f=>acc.push(f));if(o.video)acc.push(o.video);o.hijos.forEach(h=>fotosDe(h,acc));return acc}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function nodo(o,p){const lv=p.length-1,ps=p.join('.');
 return `<div class="n ${CL[lv]}${lv===1?' s2':''}" data-p="${ps}">
<div class="row"><span class="tag">${NIV[lv]} ${p.map(i=>i+1).join('.')}</span>
<input value="${esc(o.nombre)}" placeholder="Nombre ${NIV[lv].toLowerCase()}" data-a="nom" enterkeyhint="done" autocomplete="off">
<button class="mv" data-a="mov" aria-label="Mover">↕</button><button class="x" data-a="del" aria-label="Eliminar">✕</button></div>
${fotosHTML(o)}
${videoHTML(o)}
${o.hijos.map((h,i)=>nodo(h,[...p,i])).join('')}
${lv<2?`<button class="add" data-a="add">+ ${NIV[lv+1]}</button>`:''}</div>`}
const tieneF=o=>o.fotos.length>0;
function videoHTML(o){if(!o.video)return `<div class="vrow"><button data-a="vcam">🎥 Grabar video</button><button data-a="vgal">🎞️ Video de galería</button></div>`;
 return `<div class="vid"><div class="vbox" data-a="verV"><img data-vp="${o.video}" alt=""><span class="play">▶</span><span class="bdg"></span><button class="del" data-a="delV" aria-label="Quitar video">×</button></div><div class="rot"></div><button class="vgal" data-a="gV">💾 Guardar en galería</button></div>`}
function refrescarVideo(n,o){n.querySelectorAll(':scope>.vrow,:scope>.vid').forEach(e=>e.remove());
 const ref=n.querySelector(':scope>.fotos')||n.querySelector(':scope>.ftog');ref.insertAdjacentHTML('afterend',videoHTML(o));rotulos();cargarImgs(n)}
function fotosHTML(o){const on=o.req||tieneF(o);
 return `<button class="ftog${on?' on':''}" data-a="req">📷 ${on?'Requiere fotos ✓':'Requiere fotos'}</button>${on?`<div class="fotos">${o.fotos.map((f,k)=>slot(o,k)).join('')}${o.fotos.length<MAXF?slot(o,o.fotos.length):''}</div>`:''}`}
function slot(o,k){const f=o.fotos[k];
 return `<div class="slot" data-k="${k}">${f?`<div class="box on"><img data-f="${f}" data-a="ver" alt="Foto ${k+1}"><span class="bdg"></span><button class="del" data-a="delF" aria-label="Quitar foto">×</button></div>`
 :`<div class="box"><button data-a="cam">📷 Cámara</button><button data-a="gal">🖼️ Galería</button></div>`}
<div class="rot${f?'':' pend'}"></div></div>`}

function render(focusPath){
 L.innerHTML=D.partes.length?D.partes.map((o,i)=>nodo(o,[i])).join(''):'<div class="vacio">Comienza con “+ Parte”. Cada elemento admite hasta 4 fotos.</div>';
 rotulos();cargarImgs(L);
 if(focusPath!=null){const el=L.querySelector(`[data-p="${focusPath}"]>.row input`);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center',behavior:'smooth'})}}
}
function refrescarFotos(n,o){n.querySelectorAll(':scope>.fotos,:scope>.ftog').forEach(e=>e.remove());
 n.querySelector(':scope>.row').insertAdjacentHTML('afterend',fotosHTML(o));rotulos();cargarImgs(n.querySelector(':scope>.fotos'))}
function rotulos(){L.querySelectorAll('.n').forEach(n=>{const p=P(n.dataset.p),r=ruta(p),num=p.map(i=>i+1).join('.');
 let o={hijos:D.partes};const falta=p.some(i=>!(o=o.hijos[i]).nombre.trim());
 n.querySelectorAll(':scope>.fotos>.slot').forEach(sl=>{const k=+sl.dataset.k,rt=sl.querySelector('.rot'),b=sl.querySelector('.bdg');
  if(b){b.textContent=num+' · Foto '+(k+1);rt.textContent=falta?'⚠ Falta nombre: '+r:r;rt.classList.toggle('warn',falta)}
  else rt.textContent=k===0?'Foto 1 pendiente':'Foto '+(k+1)+' (opcional, máx. '+MAXF+')'});
  const v=n.querySelector(':scope>.vid');if(v){v.querySelector('.bdg').textContent=num+' · Video';const rt=v.querySelector('.rot');rt.textContent=falta?'⚠ Falta nombre: '+r:r;rt.classList.toggle('warn',falta)}})}
function ver(n,k){const p=P(n.dataset.p),o=get(p),im=n.querySelector(`:scope>.fotos>.slot[data-k="${k}"] img`);if(!im)return;
 const nm=o.nombre.trim()||'(sin nombre)';
 ver_t.textContent=p.map(i=>i+1).join('.')+' · Foto '+(k+1)+' · '+nm;ver_b.textContent=ruta(p);ver_v.style.display='none';ver_i.style.display='block';ver_i.src=im.src;verEl.classList.add('on');history.pushState({ver:1},'')}
function cerrarVer(){if(verEl.classList.contains('on')){verEl.classList.remove('on');ver_i.removeAttribute('src');ver_v.pause();ver_v.removeAttribute('src');ver_v.load()}}
async function verVideo(p,o){const u=await urlDe(o.video);if(!u)return toast('Video no disponible');
 ver_t.textContent=p.map(i=>i+1).join('.')+' · Video · '+(o.nombre.trim()||'(sin nombre)');ver_b.textContent=ruta(p);
 ver_i.style.display='none';ver_v.style.display='block';ver_v.src=u;verEl.classList.add('on');history.pushState({ver:1},'');ver_v.play().catch(()=>{})}
function cargarImgs(root){if(!root)return;root.querySelectorAll('img[data-f]').forEach(async im=>{const u=await urlDe(im.dataset.f);if(u)im.src=u;else im.alt='(foto no disponible)'});
 root.querySelectorAll('img[data-vp]').forEach(async im=>{const u=await urlPoster(im.dataset.vp);if(u)im.src=u;else im.remove()})}

/* ===== Eventos (delegación) ===== */
let rotT=0;
L.addEventListener('input',e=>{const t=e.target;if(t.dataset.a!=='nom')return;get(P(t.closest('.n').dataset.p)).nombre=t.value;save();
 clearTimeout(rotT);rotT=setTimeout(rotulos,120)});
L.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.a==='nom')e.target.blur()});
L.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;
 const n=b.closest('.n'),ps=n.dataset.p,p=P(ps),o=get(p),a=b.dataset.a;
 if(a==='add'){o.hijos.push(nuevo());save();render(ps+'.'+(o.hijos.length-1))}
 else if(a==='del'){const nf=fotosDe(o).length;
  if((o.nombre||nf||o.hijos.length)&&!confirm(`¿Eliminar ${NIV[p.length-1].toLowerCase()} "${o.nombre||'(sin nombre)'}"${o.hijos.length?' y todo su contenido':''}?`))return;
  const ids=fotosDe(o);padre(p).hijos.splice(p.at(-1),1);save();ids.forEach(soltarURL);render();fDel(ids).catch(()=>{})}
 else if(a==='ver'){ver(n,+b.closest('.slot').dataset.k)}
 else if(a==='req'){if(tieneF(o))return toast('Quita las fotos para desmarcar');o.req=!o.req;save();refrescarFotos(n,o)}
 else if(a==='cam'||a==='gal'){tgt={id:o.id,k:+b.closest('.slot').dataset.k};const inp=a==='cam'?cam:gal;inp.value='';inp.click()}
 else if(a==='mov'){abrirMov(o.id)}
 else if(a==='vcam'||a==='vgal'){tgt={id:o.id,vid:true,cam:a==='vcam'};const inp=a==='vcam'?vcam:vgal;inp.value='';inp.click()}
 else if(a==='verV'){verVideo(p,o)}
 else if(a==='gV'){guardarGaleria(o,p)}

const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,ko)=>setTimeout(()=>ko({code:'nube/stalled'}),ms))]);
const LIM_NUBE=25*1048576; // archivos más grandes (videos largos) quedan solo en el teléfono
function fbInit(){return fbP||(fbP=(async()=>{
 if(window.__FB_MOCK){FB=window.__FB_MOCK}else{
  const B='https://www.gstatic.com/firebasejs/11.10.0/';
  const [ap,au,fs]=await Promise.all(['firebase-app','firebase-auth','firebase-firestore'].map(m=>import(B+m+'.js')));
  const app=ap.initializeApp(firebaseConfig),A=au.getAuth(app),F=fs.getFirestore(app);
  // Archivos (fotos/videos) guardados en Firestore en trozos de 900 KB: funciona con el plan gratis, sin Storage
  const CH=900000,clave=path=>{const m=path.match(/^([^/]+)\/([^/]+)\/media\/(.+)$/);return{col:m[1]+'/'+m[2]+'/blobs',k:m[3].replace(/\//g,'~')}};
  FB={onUser:cb=>au.onAuthStateChanged(A,cb),login:()=>au.signInWithPopup(A,new au.GoogleAuthProvider()),logout:()=>au.signOut(A),
   put:async(path,blob,onp)=>{const {col,k}=clave(path),buf=new Uint8Array(await blob.arrayBuffer()),n=Math.max(1,Math.ceil(buf.length/CH));
    for(let i=0;i<n;i++){const fin=Math.min(buf.length,(i+1)*CH);
     await conTiempo(fs.setDoc(fs.doc(F,col+'/'+k+'~'+i),{d:fs.Bytes.fromUint8Array(buf.slice(i*CH,fin)),i,n,t:blob.type||''}),60000);onp&&onp(fin)}},
   getBlob:async path=>{const {col,k}=clave(path);const d0=await fs.getDoc(fs.doc(F,col+'/'+k+'~0'));if(!d0.exists())throw new Error('archivo no encontrado en la nube');
    const x=d0.data(),parts=[x.d.toUint8Array()];for(let i=1;i<x.n;i++){const di=await fs.getDoc(fs.doc(F,col+'/'+k+'~'+i));parts.push(di.data().d.toUint8Array())}
    return new Blob(parts,{type:x.t||''})},
   setDoc:(path,data)=>conTiempo(fs.setDoc(fs.doc(F,path),{...data,actualizado:fs.serverTimestamp()}),60000),
   getDoc:async path=>{const d=await fs.getDoc(fs.doc(F,path));return d.exists()?d.data():null},
   list:async path=>{const r=await fs.getDocs(fs.query(fs.collection(F,path),fs.orderBy('actualizado','desc'),fs.limit(50)));
    return r.docs.map(d=>{const x=d.data();return{id:d.id,titulo:x.titulo,nFotos:x.nFotos,nVideos:x.nVideos,fecha:x.actualizado&&x.actualizado.toDate?x.actualizado.toDate():null}})}}}
 FB.onUser(u=>{usuario=u;if(u){localStorage.setItem('rr_login','1');nubeEstado=nubeEstado||'';programarRespaldo(1500)}else{localStorage.removeItem('rr_login')}pintarNube()});
 return FB})().catch(e=>{fbP=null;throw e}))}

var RAIZ=localStorage.getItem('rr_raiz')||'usuarios';
function otraRaiz(){RAIZ=RAIZ==='usuarios'?'users':'usuarios';try{localStorage.setItem('rr_raiz',RAIZ)}catch(e){}}
const esPermiso=e=>/permission|unauthorized/.test((e&&e.code)||'');
const subKey=()=>'rr_sub_'+RAIZ+'_'+(usuario?usuario.uid:'');
function subidos(){try{return new Set(JSON.parse(localStorage.getItem(subKey())||'[]'))}catch(e){return new Set()}}
function marcarSubido(s){try{localStorage.setItem(subKey(),JSON.stringify([...s]))}catch(e){}}
function programarRespaldo(ms=15000){if(!usuario)return;clearTimeout(bkT);bkT=setTimeout(()=>respaldar(false),ms)}
function estadoNube(t,clase){nubeEstado=t;btnNube.className=clase||'';nubePct.textContent=prog&&prog.pct>=0?prog.pct+'%':'';pintarNube()}
function mediaIds(){const a=[];const w=o=>{o.fotos.forEach(f=>a.push(f));if(o.video)a.push(o.video);o.hijos.forEach(w)};D.partes.forEach(w);return a}
var prog=null; // {hecho,tot,i,n,pct}
function bytesDe(x){if(x instanceof Blob)return x.size;if(x&&typeof x==='object'&&!Array.isArray(x))return Object.values(x).reduce((a,v)=>a+bytesDe(v),0);return 0}
const tam=b=>b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB';
function avance(cur){if(!prog)return;prog.cur=cur;const pct=Math.min(99,Math.floor((prog.hecho+cur)/Math.max(1,prog.tot)*100));if(pct===prog.pct)return;prog.pct=pct;
 estadoNube('Subiendo '+pct+'% ('+prog.i+' de '+prog.n+')','sync')}
async function serial(x,path,subir){if(x instanceof Blob){if(subir){await FB.put(path,x,avance);if(prog){prog.hecho+=x.size;prog.pct=-1;avance(0)}}return{__b:path,t:x.type||''}}
 if(x&&typeof x==='object'&&!Array.isArray(x)){const o={};for(const k of Object.keys(x))o[k]=await serial(x[k],path+'/'+k,subir);return o}return x}
async function deserial(x){if(x&&typeof x==='object'&&x.__b){const b=await FB.getBlob(x.__b);return x.t&&b.type!==x.t?new Blob([b],{type:x.t}):b}
 if(x&&typeof x==='object'&&!Array.isArray(x)){const o={};for(const k of Object.keys(x))o[k]=await deserial(x[k]);return o}return x}
async function respaldar(manual,rt){const r=await respaldar0(manual,rt);
 if(r==='perm'){otraRaiz();return respaldar(manual,true)}return r===true}
async function respaldar0(manual,rt){if(!usuario){if(manual)toast('Primero entra con Google');return false}
 if(!navigator.onLine){estadoNube('Sin conexión: se respaldará al volver la señal','warn');return false}
 if(!D.partes.length&&!(D.titulo||'').trim())return true;
 if(bkOcupado){bkOtra=true;return false}bkOcupado=true;clearTimeout(bkT);
 try{const u=usuario.uid;if(!D.rid){D.rid=uid();save(true)}
  const ids=mediaIds(),sub=subidos(),media={};let nv=0;
  const ents=[];let grandes=0;for(const id of ids){const v=await fGet(id);if(!v)continue;if(bytesDe(v)>LIM_NUBE){grandes++;continue}ents.push([id,v])}
  const nuevos=ents.filter(([id])=>!sub.has(id));
  if(nuevos.length){ // primero guarda los textos y lo ya subido, por si las fotos fallan
   const m0={};for(const [id,v] of ents)if(sub.has(id))m0[id]=await serial(v,RAIZ+'/'+u+'/media/'+id,false);
   estadoNube('Guardando textos…','sync');
   await FB.setDoc(RAIZ+'/'+u+'/registros/'+D.rid,{titulo:(D.titulo||'').trim(),data:JSON.stringify(D),media:JSON.stringify(m0),nFotos:Object.keys(m0).length,nVideos:0,parcial:true})}
  prog=nuevos.length?{hecho:0,tot:nuevos.reduce((a,[,v])=>a+bytesDe(v),0),i:0,n:nuevos.length,pct:-1}:null;
  if(prog)avance(0);
  for(const [id,v] of ents){const nuevoArch=!sub.has(id);if(nuevoArch){prog.i++;prog.pct=-1;avance(0)}
   media[id]=await serial(v,RAIZ+'/'+u+'/media/'+id,nuevoArch);if(nuevoArch){sub.add(id);marcarSubido(sub)}
   if(v.poster||(v.blob&&/^video/.test(v.blob.type)))nv++}
  if(prog){prog=null;estadoNube('Guardando registro…','sync')}
  await FB.setDoc(RAIZ+'/'+u+'/registros/'+D.rid,{titulo:(D.titulo||'').trim(),data:JSON.stringify(D),media:JSON.stringify(media),nFotos:ids.length-nv,nVideos:nv});
  localStorage.setItem('rr_bk',String(Date.now()));nubeLista=null;
  estadoNube('Respaldado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})+(grandes?' · '+grandes+' video(s) de más de 25 MB quedan solo en el teléfono':''),'ok');if(manual)toast('Respaldo completo ☁️');return true}
 catch(e){console.error(e);prog=null;if(!rt&&esPermiso(e))return 'perm';estadoNube('Error al respaldar: '+errNube(e),'err');if(manual)toast('No se pudo respaldar: '+errNube(e),4000);return false}
 finally{prog=null;nubePct.textContent='';bkOcupado=false;if(bkOtra){bkOtra=false;programarRespaldo(2000)}}}
function errNube(e){const c=(e&&e.code)||'';
 if(/stalled/.test(c))return 'la nube no responde: revisa la señal y que Firestore esté creado con sus reglas';
 if(/permission|unauthorized/.test(c))return 'sin permiso: revisa que las reglas de Firestore estén publicadas';
 if(/popup-closed|cancelled-popup/.test(c))return 'ventana cerrada';if(/popup-blocked/.test(c))return 'ventana bloqueada por el navegador';
 if(/unauthorized-domain/.test(c))return 'dominio no autorizado en Firebase';if(/network|unavailable/.test(c))return 'sin conexión';
 if(/resource-exhausted|quota/.test(c))return 'se alcanzó el límite gratis de Firebase por hoy';return (e&&e.message)||'error'}
async function restaurar(rid){const u=usuario.uid;const doc=await FB.getDoc(RAIZ+'/'+u+'/registros/'+rid);if(!doc)return toast('Registro no encontrado');
 const vacio=!D.partes.length&&!(D.titulo||'').trim();
 if(!vacio&&!confirm('Se reemplazará el registro actual en pantalla por "'+(doc.titulo||'Sin título')+'". El actual queda respaldado en la nube. ¿Continuar?'))return;
 if(!vacio&&!(await respaldar(false))&&!confirm('No se pudo respaldar el registro actual. ¿Reemplazarlo igual?'))return;
 cerrarNube();const media=JSON.parse(doc.media||'{}'),ids=Object.keys(media),sub=subidos();let i=0;
 try{for(const id of ids){i++;toast('Descargando '+i+' de '+ids.length+'…',0);if(!(await fGet(id))){await fPut(id,await deserial(media[id]))}sub.add(id)}marcarSubido(sub)}
 catch(e){console.error(e);return toast('Error al descargar: '+errNube(e),4000)}
 D=JSON.parse(doc.data);normalizar(D.partes);D.rid=rid;urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();save(true);tit.value=D.titulo||'';render();updPend();
 toast('Registro restaurado ✓')}

async function migrar(){const old=localStorage.getItem('rr2');if(!old||localStorage.getItem(KEY))return false;
 try{const O=JSON.parse(old);const conv=async o=>{const n=nuevo();n.nombre=o.nombre||'';n.req=!!o.req;
   for(const f of (o.fotos||[]).slice(0,MAXF)){if(f&&f.src){const blob=await (await fetch(f.src)).blob();const id=uid();await fPut(id,{blob,w:f.w,h:f.h});n.fotos.push(id)}}
   for(const h of o.hijos||[])n.hijos.push(await conv(h));return n};
  D={titulo:O.titulo||'',partes:[]};for(const p of O.partes||[])D.partes.push(await conv(p));save();localStorage.removeItem('rr2');return true}
 catch(e){console.error(e);return false}}
