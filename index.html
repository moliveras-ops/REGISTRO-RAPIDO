<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<title>Registro Rápido</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#eef1f5;color:#1a1a1a}
header{background:#0b3d6e;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));font-size:19px;font-weight:600;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center}
header span{flex:1}
main{padding:10px;padding-bottom:calc(90px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
.n{background:#fff;border-radius:10px;padding:8px;margin:8px 0;box-shadow:0 1px 3px #0002}
.n .n{margin-left:6px;border-left:4px solid #2a6fb0;box-shadow:none;background:#f5f8fc;border-radius:0 8px 8px 0}
.n .n .n{border-left-color:#e08a00;background:#fffaf2}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0;font-size:16px;padding:9px;border:1px solid #ccd;border-radius:6px;background:#fff}
.tag{font-size:11px;color:#fff;background:#0b3d6e;border-radius:4px;padding:3px 6px;white-space:nowrap}
.c>.row .tag{background:#2a6fb0}.s>.row .tag{background:#e08a00}
button{font-size:14px;padding:9px 11px;border:0;border-radius:6px;background:#0b3d6e;color:#fff;cursor:pointer;touch-action:manipulation}
button:active{opacity:.75}
button.x{background:#c62828}button.g{background:#2e7d32}button.add{background:#2a6fb0;margin-top:4px}
.s2 button.add{background:#e08a00}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.slot{width:calc(50% - 4px);max-width:170px}
.box{aspect-ratio:1;border:2px dashed #99a;border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center;padding:8px;background:#fff}
.box.on{border:0;padding:0}
.box img{width:100%;height:100%;object-fit:cover;display:block}
.box button{font-size:13px;padding:9px 4px;background:#e8eef6;color:#0b3d6e}
.box .del{position:absolute;top:4px;right:4px;background:#c62828;color:#fff;border-radius:50%;width:28px;height:28px;padding:0;font-size:17px;line-height:28px}
.ftog{background:#889;font-size:13px;padding:8px 12px;margin:6px 0 2px}
.ftog.on{background:#2e7d32}
#pend{font-size:13px;color:#ffd54f;font-weight:500}
.rot{font-size:12px;font-weight:600;color:#0b3d6e;background:#e8eef6;border-radius:0 0 8px 8px;padding:5px 6px;line-height:1.25;word-break:break-word;text-align:center}
.rot.warn{color:#b3261e;background:#fdecea}
.rot.pend{color:#8a5a00;background:#fff3d6;border-radius:8px;margin-top:4px}
.box.on{border-radius:8px 8px 0 0}
.bdg{position:absolute;top:4px;left:4px;background:#0b3d6ee6;color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:12px;pointer-events:none}
.c .bdg{background:#2a6fb0e6}.s .bdg{background:#e08a00e6}
.box img{cursor:zoom-in}
#ver{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#ver.on{display:flex}
#ver .vt{color:#fff;background:#0b3d6e;padding:12px 50px 12px 14px;padding-top:max(12px,env(safe-area-inset-top));font-weight:700;font-size:15px;position:relative}
#ver .vt button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#c62828;width:36px;height:36px;border-radius:50%;padding:0;font-size:20px}
#ver img{flex:1;min-height:0;object-fit:contain;width:100%}
#ver .vb{color:#0b3d6e;background:#e8eef6;padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));font-weight:700;text-align:center;font-size:15px}
#bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -2px 6px #0002;z-index:5}
#bar button{flex:1;padding:13px;font-size:15px}
#tit{width:100%;font-size:16px;padding:10px;border-radius:6px;border:1px solid #ccd}
#addP{width:100%;margin-top:8px;padding:13px;font-size:15px}
#msg{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
.vacio{color:#667;text-align:center;padding:16px 8px;font-size:14px}
button.mv{background:#556}
.n.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px #ffb300}100%{box-shadow:0 1px 3px #0002}}
#mov{position:fixed;inset:0;background:#0008;z-index:15;display:none;align-items:flex-end;justify-content:center}
#mov.on{display:flex}
#mov .hc{background:#fff;width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#mov .ht{display:flex;align-items:center;gap:8px;font-weight:700;color:#0b3d6e;font-size:15px;margin-bottom:4px}
#mov .ht span{flex:1;word-break:break-word}
#mov .ht button{background:#c62828;width:34px;height:34px;border-radius:50%;padding:0;font-size:19px;flex:none}
#mov .pos{font-size:13px;color:#556;margin-bottom:8px}
#mov .hrow{display:flex;gap:8px}#mov .hrow button{flex:1;padding:12px}
#mov button:disabled{opacity:.35}
#mov .hsub{font-size:13px;font-weight:600;color:#334;margin:14px 0 6px}
#mov .dst{display:block;width:100%;text-align:left;background:#e8eef6;color:#0b3d6e;margin:5px 0;padding:11px}
#mov .dst.l1{margin-left:16px;width:calc(100% - 16px)}#mov .dst.l2{margin-left:32px;width:calc(100% - 32px)}
#mov .dst small{display:block;font-weight:400;color:#556;font-size:12px;margin-top:2px}
#mov .nota{font-size:12px;color:#667;margin-top:8px}
</style></head><body>
<header><span>Registro Rápido <small id="pend"></small></span><button class="x" id="btnNuevo">Nuevo</button></header>
<main>
<input id="tit" placeholder="Título del informe" autocomplete="off">
<div id="L"></div>
<button id="addP">+ Parte</button>
</main>
<div id="bar"><button id="btnWord">Informe Word</button><button class="g" id="btnPdf">Informe PDF</button></div>
<div id="msg"></div>
<div id="ver"><div class="vt"><span id="ver_t"></span><button id="ver_x" aria-label="Cerrar">×</button></div><img id="ver_i" alt=""><div class="vb" id="ver_b"></div></div>
<div id="mov"><div class="hc"><div class="ht"><span id="mov_t"></span><button id="mov_x" aria-label="Cerrar">×</button></div>
<div class="pos" id="mov_p"></div><div class="hrow"><button id="mov_up">↑ Subir</button><button id="mov_dn">↓ Bajar</button></div>
<div class="hsub">Mover dentro de:</div><div id="mov_l"></div><div class="nota">Al moverlo se lleva todo su contenido y fotos. Máximo 3 niveles.</div></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<script>
'use strict';
/* ===== Almacenamiento: estructura en localStorage, fotos (Blob) en IndexedDB ===== */
const KEY='rr3';
const NIV=['Parte','Componente','Subparte'],CL=['','c','s'],MAXF=4;
let D={titulo:'',partes:[]};
try{D=JSON.parse(localStorage.getItem(KEY))||D}catch(e){}
// fotos: lista compacta de ids (hasta 4)
(function norm(l){l.forEach(o=>{o.fotos=(o.fotos||[]).filter(Boolean).slice(0,MAXF);o.hijos=o.hijos||[];norm(o.hijos)})})(D.partes);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar')}updPend()};
function pendientes(){let n=0;const w=o=>{if(o.req&&!o.fotos.length)n++;o.hijos.forEach(w)};D.partes.forEach(w);return n}
function updPend(){const n=pendientes();pend.textContent=n?n+' sin foto':''}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nuevo=()=>({id:uid(),nombre:'',req:false,fotos:[],hijos:[]});

let dbP=null;
function db(){return dbP||(dbP=new Promise((ok,ko)=>{const r=indexedDB.open('registro-rapido',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((ok,ko)=>{const t=d.transaction('fotos',mode),s=t.objectStore('fotos');
 const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})}
const fPut=(id,v)=>idb('readwrite',s=>s.put(v,id));
const fGet=id=>idb('readonly',s=>s.get(id));
const fDel=ids=>ids.length?idb('readwrite',s=>{ids.forEach(i=>s.delete(i))}):Promise.resolve();
const fClear=()=>idb('readwrite',s=>s.clear());
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

const urls=new Map(); // id -> objectURL
async function urlDe(id){if(urls.has(id))return urls.get(id);const f=await fGet(id);if(!f)return null;const u=URL.createObjectURL(f.blob);urls.set(id,u);return u}
function soltarURL(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}

/* ===== Árbol ===== */
const P=s=>s.split('.').map(Number);
function get(p){let o={hijos:D.partes};p.forEach(i=>o=o.hijos[i]);return o}
function padre(p){return p.length>1?get(p.slice(0,-1)):{hijos:D.partes}}
function ruta(p){const r=[];let o={hijos:D.partes};p.forEach((i,k)=>{o=o.hijos[i];r.push(o.nombre.trim()||'(sin nombre '+NIV[k].toLowerCase()+')')});return r.join(' - ')}
function fotosDe(o,acc=[]){o.fotos.forEach(f=>acc.push(f));o.hijos.forEach(h=>fotosDe(h,acc));return acc}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function nodo(o,p){const lv=p.length-1,ps=p.join('.');
 return `<div class="n ${CL[lv]}${lv===1?' s2':''}" data-p="${ps}">
<div class="row"><span class="tag">${NIV[lv]} ${p.map(i=>i+1).join('.')}</span>
<input value="${esc(o.nombre)}" placeholder="Nombre ${NIV[lv].toLowerCase()}" data-a="nom" enterkeyhint="done" autocomplete="off">
<button class="mv" data-a="mov" aria-label="Mover">↕</button><button class="x" data-a="del" aria-label="Eliminar">✕</button></div>
${fotosHTML(o)}
${o.hijos.map((h,i)=>nodo(h,[...p,i])).join('')}
${lv<2?`<button class="add" data-a="add">+ ${NIV[lv+1]}</button>`:''}</div>`}
const tieneF=o=>o.fotos.length>0;
function fotosHTML(o){const on=o.req||tieneF(o);
 return `<button class="ftog${on?' on':''}" data-a="req">📷 ${on?'Requiere fotos ✓':'Requiere fotos'}</button>${on?`<div class="fotos">${o.fotos.map((f,k)=>slot(o,k)).join('')}${o.fotos.length<MAXF?slot(o,o.fotos.length):''}</div>`:''}`}
function slot(o,k){const f=o.fotos[k];
 return `<div class="slot" data-k="${k}">${f?`<div class="box on"><img data-f="${f}" data-a="ver" alt="Foto ${k+1}"><span class="bdg"></span><button class="del" data-a="delF" aria-label="Quitar foto">×</button></div>`
 :`<div class="box"><button data-a="cam">📷 Cámara</button><button data-a="gal">🖼️ Galería</button></div>`}
<div class="rot${f?'':' pend'}"></div></div>`}

function render(focusPath){
 L.innerHTML=D.partes.length?D.partes.map((o,i)=>nodo(o,[i])).join(''):'<div class="vacio">Comienza con “+ Parte”. Cada elemento admite hasta 4 fotos.</div>';
 rotulos();cargarImgs(L);
 if(focusPath!=null){const el=L.querySelector(`[data-p="${focusPath}"]>.row input`);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center',behavior:'smooth'})}}
}
function refrescarFotos(n,o){n.querySelectorAll(':scope>.fotos,:scope>.ftog').forEach(e=>e.remove());
 n.querySelector(':scope>.row').insertAdjacentHTML('afterend',fotosHTML(o));rotulos();cargarImgs(n.querySelector(':scope>.fotos'))}
function rotulos(){L.querySelectorAll('.n').forEach(n=>{const p=P(n.dataset.p),r=ruta(p),num=p.map(i=>i+1).join('.');
 let o={hijos:D.partes};const falta=p.some(i=>!(o=o.hijos[i]).nombre.trim());
 n.querySelectorAll(':scope>.fotos>.slot').forEach(sl=>{const k=+sl.dataset.k,rt=sl.querySelector('.rot'),b=sl.querySelector('.bdg');
  if(b){b.textContent=num+' · Foto '+(k+1);rt.textContent=falta?'⚠ Falta nombre: '+r:r;rt.classList.toggle('warn',falta)}
  else rt.textContent=k===0?'Foto 1 pendiente':'Foto '+(k+1)+' (opcional, máx. '+MAXF+')'})})}
function ver(n,k){const p=P(n.dataset.p),o=get(p),im=n.querySelector(`:scope>.fotos>.slot[data-k="${k}"] img`);if(!im)return;
 const nm=o.nombre.trim()||'(sin nombre)';
 ver_t.textContent=p.map(i=>i+1).join('.')+' · Foto '+(k+1)+' · '+nm;ver_b.textContent=ruta(p);ver_i.src=im.src;verEl.classList.add('on');history.pushState({ver:1},'')}
function cerrarVer(){if(verEl.classList.contains('on')){verEl.classList.remove('on');ver_i.removeAttribute('src')}}
function cargarImgs(root){root.querySelectorAll('img[data-f]').forEach(async im=>{const u=await urlDe(im.dataset.f);if(u)im.src=u;else im.alt='(foto no disponible)'})}

/* ===== Eventos (delegación) ===== */
let rotT=0;
L.addEventListener('input',e=>{const t=e.target;if(t.dataset.a!=='nom')return;get(P(t.closest('.n').dataset.p)).nombre=t.value;save();
 clearTimeout(rotT);rotT=setTimeout(rotulos,120)});
L.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.a==='nom')e.target.blur()});
L.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;
 const n=b.closest('.n'),ps=n.dataset.p,p=P(ps),o=get(p),a=b.dataset.a;
 if(a==='add'){o.hijos.push(nuevo());save();render(ps+'.'+(o.hijos.length-1))}
 else if(a==='del'){const nf=fotosDe(o).length;
  if((o.nombre||nf||o.hijos.length)&&!confirm(`¿Eliminar ${NIV[p.length-1].toLowerCase()} "${o.nombre||'(sin nombre)'}"${o.hijos.length?' y todo su contenido':''}?`))return;
  const ids=fotosDe(o);padre(p).hijos.splice(p.at(-1),1);save();ids.forEach(soltarURL);render();fDel(ids).catch(()=>{})}
 else if(a==='ver'){ver(n,+b.closest('.slot').dataset.k)}
 else if(a==='req'){if(tieneF(o))return toast('Quita las fotos para desmarcar');o.req=!o.req;save();refrescarFotos(n,o)}
 else if(a==='cam'||a==='gal'){tgt={id:o.id,k:+b.closest('.slot').dataset.k};const inp=a==='cam'?cam:gal;inp.value='';inp.click()}
 else if(a==='mov'){abrirMov(o.id)}
 else if(a==='delF'){const k=+b.closest('.slot').dataset.k,id=o.fotos[k];o.fotos.splice(k,1);soltarURL(id);
  o.req=true;save();refrescarFotos(n,o);fDel([id]).catch(()=>{})}
});
addP.onclick=()=>{D.partes.push(nuevo());save();render(String(D.partes.length-1))};
tit.value=D.titulo||'';tit.oninput=()=>{D.titulo=tit.value;save()};
btnNuevo.onclick=async()=>{if(!confirm('¿Borrar todo el registro y sus fotos?'))return;
 D={titulo:'',partes:[]};save();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();tit.value='';render();await fClear().catch(()=>{});toast('Registro vacío')};

/* ===== Fotos ===== */
let tgt=null;
function buscarId(id,lista=D.partes,p=[]){for(let i=0;i<lista.length;i++){if(lista[i].id===id)return[...p,i];const r=buscarId(id,lista[i].hijos,[...p,i]);if(r)return r}return null}
async function procesar(file){const MAX=1600;let src,w,h;
 try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}
 catch(e){src=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ko(new Error('Imagen no válida'));im.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
 const s=Math.min(1,MAX/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
 if(src.close)src.close();else URL.revokeObjectURL(src.src);
 const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.8));if(!blob)throw new Error('No se pudo comprimir');
 return{blob,w:c.width,h:c.height}}
async function alElegir(inp){const f=inp.files[0],t=tgt;tgt=null;if(!f||!t)return;
 const p=buscarId(t.id);if(!p)return;toast('Procesando foto…',0);
 try{const v=await procesar(f),id=uid();await fPut(id,v);
  const p2=buscarId(t.id);if(!p2){await fDel([id]);return}const o=get(p2);let old=null;
  if(t.k<o.fotos.length){old=o.fotos[t.k];o.fotos[t.k]=id}else if(o.fotos.length<MAXF)o.fotos.push(id);else{await fDel([id]);return toast('Máximo '+MAXF+' fotos')}
  save();
  if(old){soltarURL(old);fDel([old]).catch(()=>{})}
  const el=L.querySelector(`[data-p="${p2.join('.')}"]`);if(el)refrescarFotos(el,o);
  toast('Foto guardada')}
 catch(e){toast('Error con la foto: '+e.message)}}
const verEl=document.getElementById('ver');
ver_x.onclick=()=>history.back();verEl.onclick=e=>{if(e.target===verEl||e.target===ver_i)history.back()};
addEventListener('popstate',()=>{cerrarVer();cerrarMov()});
cam.onchange=()=>alElegir(cam);gal.onchange=()=>alElegir(gal);

/* ===== Mover / cambiar jerarquía ===== */
const movEl=document.getElementById('mov');let movId=null;
const altura=o=>o.hijos.length?1+Math.max(...o.hijos.map(altura)):0;
const contiene=(o,id)=>o.id===id||o.hijos.some(h=>contiene(h,id));
const nomDe=(o,lv)=>o.nombre.trim()||'(sin nombre '+NIV[lv].toLowerCase()+')';
function abrirMov(id){movId=id;pintarMov();if(!movEl.classList.contains('on')){movEl.classList.add('on');history.pushState({mov:1},'')}}
function cerrarMov(){movEl.classList.remove('on');movId=null}
function pintarMov(){const p=buscarId(movId);if(!p)return history.back();const o=get(p),lv=p.length-1,her=padre(p).hijos,i=p.at(-1);
 mov_t.textContent='Mover '+NIV[lv].toLowerCase()+' '+p.map(x=>x+1).join('.')+' · '+nomDe(o,lv);
 mov_p.textContent='Posición '+(i+1)+' de '+her.length+(o.hijos.length?' · incluye '+fotosDe(o).length+' foto(s) y su contenido':'');
 mov_up.disabled=i===0;mov_dn.disabled=i===her.length-1;
 const h=altura(o),pid=lv?get(p.slice(0,-1)).id:'root',out=[];
 const bt=(id,lvd,txt,sub)=>out.push(`<button class="dst l${lvd}" data-d="${id}"${id===pid?' disabled':''}>${esc(txt)}<small>${id===pid?'Ubicación actual':esc(sub)}</small></button>`);
 bt('root',0,'Nivel principal','Quedará como Parte');
 D.partes.forEach((a,ia)=>{if(contiene(o,a.id))return;
  if(h<=1)bt(a.id,1,'Parte '+(ia+1)+' · '+nomDe(a,0),'Quedará como Componente');
  if(h===0)a.hijos.forEach((c,ic)=>{if(c.id!==o.id)bt(c.id,2,'Componente '+(ia+1)+'.'+(ic+1)+' · '+nomDe(c,1),'Quedará como Subparte')})});
 mov_l.innerHTML=out.join('')}
function resaltar(id){const p=buscarId(id);if(!p)return;const el=L.querySelector(`[data-p="${p.join('.')}"]`);if(!el)return;
 el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function desplazar(dlt){const p=buscarId(movId);if(!p)return;const her=padre(p).hijos,i=p.at(-1),j=i+dlt;if(j<0||j>=her.length)return;
 [her[i],her[j]]=[her[j],her[i]];save();render();pintarMov();resaltar(movId)}
mov_up.onclick=()=>desplazar(-1);mov_dn.onclick=()=>desplazar(1);
mov_l.onclick=e=>{const b=e.target.closest('[data-d]');if(!b||b.disabled)return;const p=buscarId(movId);if(!p)return;
 const o=padre(p).hijos.splice(p.at(-1),1)[0],d=b.dataset.d;
 const dest=d==='root'?D.partes:get(buscarId(d)).hijos;dest.push(o);save();render();const id=movId;history.back();
 const np=buscarId(id);toast('Movido: ahora es '+NIV[np.length-1]+' '+np.map(x=>x+1).join('.'));setTimeout(()=>resaltar(id),50)};
mov_x.onclick=()=>history.back();movEl.onclick=e=>{if(e.target===movEl)history.back()};

/* ===== Utilidades ===== */
let msgT=0;function toast(t,ms=1800){msg.textContent=t;msg.style.display='block';clearTimeout(msgT);if(ms)msgT=setTimeout(()=>msg.style.display='none',ms)}
const libs={};
function cargar(src){return libs[src]||(libs[src]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;
 s.onerror=()=>{delete libs[src];s.remove();ko(new Error('No se pudo cargar '+src+' (¿sin conexión?)'))};document.head.appendChild(s)}))}
function lista(){const r=[];const walk=(o,p)=>{const nm=o.nombre.trim()||'(sin nombre)';const num=p.map(i=>i+1).join('.');
 r.push({nivel:p.length-1,titulo:num+'. '+nm,ruta:ruta(p),fotos:o.fotos.slice()});o.hijos.forEach((h,i)=>walk(h,[...p,i]))};
 D.partes.forEach((o,i)=>walk(o,[i]));return r}
const fname=e=>(((D.titulo||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w .()-]/g,'').replace(/\s+/g,' ').trim())||'Informe Registro Rapido')+'.'+e;
const fecha=()=>new Date().toLocaleDateString('es-CL');
function bajar(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
let ocupado=false;
async function generar(tipo,fn){if(ocupado)return;if(!D.partes.length)return toast('Agrega al menos una Parte');
 const np=pendientes();if(np&&!confirm('Hay '+np+' elemento(s) que requieren fotos y no tienen. ¿Generar igual?'))return;
 ocupado=true;toast('Generando '+tipo+'…',0);
 try{await fn();toast(tipo+' listo')}catch(e){console.error(e);toast('Error: '+e.message,4000)}finally{ocupado=false}}

/* ===== Datos comunes de informe ===== */
const AZUL='0B3D6E';
async function fotosInforme(e){const r=[];for(let k=0;k<e.fotos.length;k++){const f=await fGet(e.fotos[k]);if(f)r.push({n:k+1,w:f.w,h:f.h,data:new Uint8Array(await f.blob.arrayBuffer()),cap:'Foto '+(k+1)+' · '+e.titulo,nom:e.ruta})}return r}
const ajustar=(w,h,mw,mh)=>{const s=Math.min(mw/w,mh/h);return[w*s,h*s]};
const pares=a=>{const r=[];for(let i=0;i<a.length;i+=2)r.push(a.slice(i,i+2));return r};
const totalFotos=()=>{let n=0;const w=o=>{n+=o.fotos.length;o.hijos.forEach(w)};D.partes.forEach(w);return n};

/* ===== Word (.docx) ===== */
async function word(){await cargar('lib/docx.umd.js');
 const {Document,Packer,Paragraph,TextRun,ImageRun,HeadingLevel,AlignmentType,Table,TableRow,TableCell,WidthType,ShadingType,BorderStyle,
  VerticalAlign,Header,Footer,PageNumber,TableLayoutType}=window.docx;
 const titulo=(D.titulo||'').trim()||'Informe';
 const B={style:BorderStyle.SINGLE,size:6,color:'9FB3CC'};const BORDES={top:B,bottom:B,left:B,right:B,insideHorizontal:B,insideVertical:B};
 const ANCHO=9638; // ancho útil A4 con márgenes de 2 cm (twips)
 const ch=[
  new Paragraph({heading:HeadingLevel.TITLE,alignment:AlignmentType.CENTER,children:[new TextRun(titulo)]}),
  new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:360},border:{bottom:{style:BorderStyle.SINGLE,size:12,color:AZUL,space:8}},
   children:[new TextRun({text:'Fecha: '+fecha()+'   ·   '+totalFotos()+' fotografía(s)',color:'555555',size:20})]})];
 const H=[HeadingLevel.HEADING_1,HeadingLevel.HEADING_2,HeadingLevel.HEADING_3];
 for(const e of lista()){
  ch.push(new Paragraph({heading:H[e.nivel],keepNext:true,children:[new TextRun(e.titulo)],
   ...(e.nivel===0?{border:{bottom:{style:BorderStyle.SINGLE,size:6,color:AZUL,space:2}}}:{})}));
  const fs=await fotosInforme(e);if(!fs.length)continue;
  const uno=fs.length===1,colW=uno?ANCHO*0.6:ANCHO/2,maxPx=uno?380:300;
  const celdaTit=f=>new TableCell({width:{size:colW,type:WidthType.DXA},shading:{type:ShadingType.CLEAR,color:'auto',fill:AZUL},verticalAlign:VerticalAlign.CENTER,
   margins:{top:60,bottom:60,left:100,right:100},children:[new Paragraph({alignment:AlignmentType.CENTER,keepNext:true,children:[new TextRun({text:f.cap,bold:true,color:'FFFFFF',size:18})]})]});
  const celdaNom=f=>new TableCell({width:{size:colW,type:WidthType.DXA},shading:{type:ShadingType.CLEAR,color:'auto',fill:'E8EEF6'},verticalAlign:VerticalAlign.CENTER,
   margins:{top:60,bottom:60,left:100,right:100},children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:f.nom,bold:true,color:AZUL,size:18})]})]});
  const celdaImg=f=>{const[w,h]=ajustar(f.w,f.h,maxPx,maxPx*0.85);return new TableCell({width:{size:colW,type:WidthType.DXA},verticalAlign:VerticalAlign.CENTER,
   margins:{top:80,bottom:80,left:80,right:80},children:[new Paragraph({alignment:AlignmentType.CENTER,keepNext:true,children:[new ImageRun({type:'jpg',data:f.data,
   transformation:{width:Math.round(w),height:Math.round(h)},altText:{title:'Foto '+f.n,description:f.nom,name:'Foto '+f.n}})]})]})};
  pares(fs).forEach((g,gi,G)=>{
   ch.push(new Table({alignment:AlignmentType.CENTER,layout:TableLayoutType.FIXED,width:{size:colW*g.length,type:WidthType.DXA},columnWidths:g.map(()=>colW),borders:BORDES,
    rows:[new TableRow({cantSplit:true,tableHeader:false,children:g.map(celdaTit)}),new TableRow({cantSplit:true,children:g.map(celdaImg)}),new TableRow({cantSplit:true,children:g.map(celdaNom)})]}));
   ch.push(new Paragraph({spacing:{after:gi<G.length-1?80:160},children:[]}))})}
 const doc=new Document({creator:'Registro Rápido',title:titulo,
  styles:{default:{document:{run:{font:'Calibri',size:22}},
   title:{run:{font:'Calibri',size:44,bold:true,color:AZUL},paragraph:{spacing:{after:120}}},
   heading1:{run:{font:'Calibri',size:30,bold:true,color:AZUL},paragraph:{spacing:{before:360,after:160}}},
   heading2:{run:{font:'Calibri',size:26,bold:true,color:'2A6FB0'},paragraph:{spacing:{before:240,after:120},indent:{left:280}}},
   heading3:{run:{font:'Calibri',size:23,bold:true,color:'B86E00'},paragraph:{spacing:{before:200,after:100},indent:{left:560}}}}},
  sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1134,bottom:1134,left:1134,right:1134}}},
   headers:{default:new Header({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:titulo,color:'888888',size:16})]})]})},
   footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({children:['Página ',PageNumber.CURRENT,' de ',PageNumber.TOTAL_PAGES],color:'888888',size:16})]})]})},
   children:ch}]});
 bajar(await Packer.toBlob(doc),fname('docx'))}

/* ===== PDF ===== */
async function pdf(){await cargar('lib/jspdf.umd.min.js');
 const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});const titulo=(D.titulo||'').trim()||'Informe';
 const M=15,AW=180,TOP=18,BOT=282;let y=22;
 const nl=h=>{if(y+h>BOT){d.addPage();y=TOP;return true}return false};
 const az=()=>d.setTextColor(11,61,110);
 d.setFont('helvetica','bold');d.setFontSize(20);az();d.splitTextToSize(titulo,AW).forEach(l=>{d.text(l,105,y,{align:'center'});y+=9});
 d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(85);d.text('Fecha: '+fecha()+'   ·   '+totalFotos()+' fotografía(s)',105,y,{align:'center'});y+=4;
 d.setDrawColor(11,61,110);d.setLineWidth(.6);d.line(M,y,M+AW,y);y+=10;
 const COL=[[11,61,110],[42,111,176],[184,110,0]];
 for(const e of lista()){const fsz=[15,13,11.5][e.nivel],x=M+e.nivel*5;
  d.setFont('helvetica','bold');d.setFontSize(fsz);d.setTextColor(...COL[e.nivel]);
  const ls=d.splitTextToSize(e.titulo,AW-e.nivel*5),hh=ls.length*fsz*.42+3;
  const fs=await fotosInforme(e);
  // fotos en filas de 2; la primera fila se mantiene junto a su título
  const uno=fs.length===1,cw=uno?AW*.6:AW/2,pad=2,mh=uno?95:70;
  const tablas=pares(fs).map(g=>{const tx=105-cw*g.length/2;
   d.setFont('helvetica','bold');d.setFontSize(8.5);const caps=g.map(f=>d.splitTextToSize(f.cap,cw-4));const th=Math.max(...caps.map(c=>c.length))*3.6+3.5;
   const noms=g.map(f=>d.splitTextToSize(f.nom,cw-4));const nh=Math.max(...noms.map(c=>c.length))*3.6+3.5;
   const ims=g.map(f=>ajustar(f.w,f.h,cw-pad*2,mh));const ih=Math.max(...ims.map(i=>i[1]))+pad*2;
   return{g,tx,caps,th,ims,ih,noms,nh,alto:th+ih+nh}});
  nl(hh+(tablas.length?tablas[0].alto+4:0));
  d.setFont('helvetica','bold');d.setFontSize(fsz);d.setTextColor(...COL[e.nivel]);
  ls.forEach(l=>{y+=fsz*.42;d.text(l,x,y)});y+=2;
  if(e.nivel===0){d.setDrawColor(11,61,110);d.setLineWidth(.3);d.line(M,y,M+AW,y)}
  y+=3;
  tablas.forEach((t,ti)=>{if(ti>0)nl(t.alto+4);d.setDrawColor(159,179,204);d.setLineWidth(.3);
   t.g.forEach((f,i)=>{const cx=t.tx+i*cw;
    d.setFillColor(11,61,110);d.rect(cx,y,cw,t.th,'FD');
    d.setFont('helvetica','bold');d.setFontSize(8.5);d.setTextColor(255);
    t.caps[i].forEach((l,j)=>d.text(l,cx+cw/2,y+3.2+(j+1)*3.6-1,{align:'center'}));
    d.rect(cx,y+t.th,cw,t.ih,'S');
    const[w,h]=t.ims[i];d.addImage(f.data,'JPEG',cx+(cw-w)/2,y+t.th+(t.ih-h)/2,w,h);
    const ny=y+t.th+t.ih;d.setFillColor(232,238,246);d.rect(cx,ny,cw,t.nh,'FD');d.setTextColor(11,61,110);
    t.noms[i].forEach((l,j)=>d.text(l,cx+cw/2,ny+3.2+(j+1)*3.6-1,{align:'center'}))});
   y+=t.alto+(ti<tablas.length-1?3:7)});
  if(!tablas.length)y+=2}
 const np=d.getNumberOfPages();d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(136);
 for(let i=1;i<=np;i++){d.setPage(i);d.text('Página '+i+' de '+np,105,291,{align:'center'});if(i>1)d.text(d.splitTextToSize(titulo,120)[0],M+AW,10,{align:'right'})}
 bajar(d.output('blob'),fname('pdf'))}
btnWord.onclick=()=>generar('Word',word);btnPdf.onclick=()=>generar('PDF',pdf);

/* ===== Migración desde la versión anterior (fotos en base64 dentro de localStorage) ===== */
async function migrar(){const old=localStorage.getItem('rr2');if(!old||localStorage.getItem(KEY))return false;
 try{const O=JSON.parse(old);const conv=async o=>{const n=nuevo();n.nombre=o.nombre||'';n.req=!!o.req;
   for(const f of (o.fotos||[]).slice(0,MAXF)){if(f&&f.src){const blob=await (await fetch(f.src)).blob();const id=uid();await fPut(id,{blob,w:f.w,h:f.h});n.fotos.push(id)}}
   for(const h of o.hijos||[])n.hijos.push(await conv(h));return n};
  D={titulo:O.titulo||'',partes:[]};for(const p of O.partes||[])D.partes.push(await conv(p));save();localStorage.removeItem('rr2');return true}
 catch(e){console.error(e);return false}}
migrar().then(m=>{if(m){tit.value=D.titulo;render();toast('Datos anteriores recuperados')}});
render();updPend();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
